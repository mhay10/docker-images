name: Build VPN Status

on:
  workflow_dispatch:
  push:
    tags:
      - 'vpnstatus-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vpnstatus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # When manually triggered: use short SHA
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
            # When tagged: strip 'vpnstatus-v' prefix (e.g. tag vpnstatus-v0.5.2 becomes 0.5.2)
            type=match,pattern=vpnstatus-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/vpnstatus-v') }}
            # Optionally update 'latest' on tags only
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/vpnstatus-v') }}

      - uses: docker/build-push-action@v5
        with:
          context: ./vpnstatus
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}