name: Build Caddy

on:
  workflow_dispatch:
  push:
    tags:
      - "caddy-v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/caddy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # When manually triggered: use short SHA
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
            # When tagged: strip 'caddy-v' prefix (e.g. tag caddy-v2.8.4 becomes 2.8.4)
            type=match,pattern=caddy-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/caddy-v') }}
            # Optionally update 'latest' on tags only
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/caddy-v') }}

      - uses: docker/build-push-action@v7
        with:
          context: ./caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
